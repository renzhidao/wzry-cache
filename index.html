<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者营地 · QQ 扫码授权</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-bright: #f3d97c;
            --bg-dark: #0f141c;
            --card-bg: #182230;
            --border: #28374d;
            --text-main: #e6edf5;
            --text-sub: #8fa3bf;
            --success: #38bdf8;
            --done: #4ade80;
            --warn: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 50% 20%, #1e2c40, #0a0d14 80%);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
            text-align: center;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-bright);
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 12px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .target-role {
            font-size: 13px;
            color: var(--gold);
            margin-bottom: 20px;
            background: rgba(0,0,0,0.25);
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
        }
        .qr-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 18px;
            min-width: 250px;
            min-height: 250px;
        }
        .qr-card img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            display: block;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(251, 191, 36, 0.15);
            color: var(--warn);
            border: 1px solid rgba(251, 191, 36, 0.3);
            margin-bottom: 14px;
        }
        .status-pill.scanned {
            background: rgba(56, 189, 248, 0.15);
            color: var(--success);
            border-color: rgba(56, 189, 248, 0.3);
        }
        .status-pill.done {
            background: rgba(74, 222, 128, 0.15);
            color: var(--done);
            border-color: rgba(74, 222, 128, 0.3);
        }
        .countdown {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
        }
        .steps {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 14px 16px;
            text-align: left;
            font-size: 12.5px;
            color: var(--text-sub);
            line-height: 1.6;
        }
        .steps ol { padding-left: 20px; }
        .steps li { margin-bottom: 4px; }
        .steps li b { color: var(--text-main); }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">KING CAMP OAUTH</div>
        <h1>王者营地 · QQ 扫码授权</h1>
        <div class="target-role">🎯 目标角色：雾纱 (手Q 1507区)</div>
        
        <div>
            <div class="qr-card">
                <img id="qr-img" src="" alt="等待出码…">
            </div>
        </div>

        <div id="status-pill" class="status-pill">
            <span id="status-text">正在从 GitHub 实时获取二维码…</span>
        </div>

        <div id="countdown" class="countdown">准备中…</div>

        <div class="steps">
            <ol>
                <li>使用<b>手机 QQ</b>扫描上方二维码；</li>
                <li>在手机上点击<b>「确认登录」</b>授权营地；</li>
                <li>系统将在授权后<b>自动抓取</b>雾纱角色的完整战绩。</li>
            </ol>
        </div>
    </div>

    <script>
        let curBorn = 0;
        const STATE_URL = "https://raw.githubusercontent.com/renzhidao/wzry-cache/main/state.json";

        async function fetchState() {
            try {
                const res = await fetch(STATE_URL + "?t=" + Date.now());
                if (!res.ok) return;
                const data = await res.json();
                
                const pill = document.getElementById('status-pill');
                const text = document.getElementById('status-text');
                const img = document.getElementById('qr-img');

                if (data.png) {
                    img.src = "data:image/png;base64," + data.png;
                }
                if (data.born) {
                    curBorn = data.born;
                }

                if (data.state === 'scanned') {
                    pill.className = 'status-pill scanned';
                    text.textContent = '已扫码，请在手机上点击「确认登录」';
                } else if (data.state === 'success' || data.state === 'done') {
                    pill.className = 'status-pill done';
                    text.textContent = data.msg || '登录成功！正在抓取战绩…';
                } else {
                    pill.className = 'status-pill';
                    text.textContent = data.msg || '等待手机 QQ 扫码';
                }
            } catch (e) {}
        }

        function updateTimer() {
            if (!curBorn) return;
            const now = Math.floor(Date.now() / 1000);
            const passed = now - curBorn;
            const left = Math.max(0, 80 - passed);
            const cd = document.getElementById('countdown');
            if (left > 0) {
                cd.textContent = '二维码有效期还剩 ' + left + ' 秒（过期自动轮换）';
                cd.style.color = left < 20 ? '#f87171' : '#8fa3bf';
            } else {
                cd.textContent = '正在刷新全新二维码…';
                cd.style.color = '#f87171';
            }
        }

        setInterval(fetchState, 1500);
        setInterval(updateTimer, 1000);
        fetchState();
    </script>
</body>
</html>
